# Cursor theme
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

# Wayland session hints
env = QT_QPA_PLATFORM,wayland
env = XDG_SCREENSHOTS_DIR,$HOME/screens

# NVIDIA - env vars moved to NixOS (service.nix)
env = ELECTRON_OZONE_PLATFORM_HINT,auto  # Fixes Chromium/Electron flickering

# Monitor setup
source = ~/.config/hypr/monitors.conf


# Startup programs
# exec-once = waybar & 
exec-once = dunst & 
# exec-once = caelestia-shell &
exec-once = __NIXOS_SET_ENVIRONMENT_DONE=1 noctalia-shell &
# exec-once = ghostty --gtk-single-instance=true --quit-after-last-window-closed=false --initial-window=false
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# Input configuration
input {
    kb_layout = us
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 60
    sensitivity = 2

    follow_mouse = 1
    off_window_axis_events = 2

    touchpad {
        natural_scroll = yes
        disable_while_typing = true
        clickfinger_behavior = true
        tap-to-click = true 
        scroll_factor = 0.9
    }
}

cursor {
  no_hardware_cursors = true # Hardware cursors work on newer NVIDIA drivers
  no_warps = true
}

# Gestures - 3 finger horizontal swipe to change workspaces
gesture = 3, horizontal, workspace

gestures {
    workspace_swipe_distance = 1200
    workspace_swipe_cancel_ratio = 0.3
}

general {
    # gaps_in = 2
    # gaps_out = 6,4,6,4
    gaps_in = 0 
    gaps_out = 0,0,0,0
    border_size = 0
    col.active_border = rgba(ffffff33)      
    col.inactive_border = rgba(ffffff33) 
}

decoration {
    # rounding = 20
    # rounding_power = 3.9
     blur {
       enabled = false 
       size = 6
       passes = 3
       ignore_opacity = true
       new_optimizations = true
       brightness = 1
       noise = 0.01
       contrast = 1
       popups = true
       popups_ignorealpha = 0.6
    }
    shadow {
        enabled = false 
    }
}

# Rofi layer rules
layerrule = animation fade, match:namespace rofi
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.3, match:namespace rofi

# windowrulev2 = float,class:xdg-desktop-portal-gtk,title:.*wants to open
# windowrulev2 = suppressevent maximize, class:.*
# windowrulev2 = float, class:^(org\.kde\.dolphin)$
# windowrulev2 = size 80% 80%, title:^(Home — Dolphin)$
# windowrulev2 = float, class:^(waybar)$
# windowrulev2 = pin, class:^(waybar)$
# windowrulev2 = nofocus, class:^(waybar)$
# windowrulev2 = size 100% 32, class:^(waybar)$
# windowrulev2 = move 0 0, class:^(waybar)$

# Animations
animations {
    enabled = false 
    # Curves
    bezier = expressiveFastSpatial, 0.42, 1.67, 0.21, 0.90
    bezier = expressiveSlowSpatial, 0.39, 1.29, 0.35, 0.98
    bezier = expressiveDefaultSpatial, 0.38, 1.21, 0.22, 1.00
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = standardDecel, 0, 0, 0, 1
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.52, 0.03, 0.72, 0.08
    bezier = stall, 1, -0.1, 0.7, 0.85
    # Configs
    # windows
    animation = windowsIn, 1, 3, emphasizedDecel, popin 80%
    animation = fadeIn, 1, 3, emphasizedDecel
    animation = windowsOut, 1, 2, emphasizedDecel, popin 90%
    animation = fadeOut, 1, 2, emphasizedDecel
    animation = windowsMove, 1, 3, emphasizedDecel, slide
    animation = border, 1, 10, emphasizedDecel
    # layers
    animation = layersIn, 1, 2.7, emphasizedDecel, popin 93%
    animation = layersOut, 1, 2.4, menu_accel, popin 94%
    # fade
    animation = fadeLayersIn, 1, 3, emphasizedDecel
    animation = fadeLayersOut, 1, 2.7, stall
    # workspaces
    animation = workspaces, 1, 7, menu_decel, slide
    ## specialWorkspace
    animation = specialWorkspaceIn, 1, 2.8, emphasizedDecel, slidevert
    animation = specialWorkspaceOut, 1, 1.2, emphasizedAccel, slidevert
}


misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  vfr = false                  # Force consistent frame output for smoother 60fps
  vrr = 0                      # Disable VRR (not working on this setup)
  animate_manual_resizes = false
  animate_mouse_windowdragging = false
  enable_swallow = false
  focus_on_activate = false
}

# render {
#   direct_scanout = false        # disabled - causes issues with NVIDIA PRIME
# }

dwindle {
    pseudotile = true 
    preserve_split = true 
    force_split = 2
}

master {
    new_status = master
}


xwayland {
    force_zero_scaling = true
}

$mainMod = super

# App bindings
bind = , PRINT, exec, hyprshot -m region -o ~/Pictures/Screenshots/
bind = SUPER SHIFT, W, exec, bash -c "pkill waybar; waybar"
bind = SUPERSHIFT, N, exec, dms ipc call night toggle
bind = SUPER, N, exec, dms ipc call notifications toggle
bind = shift, PRINT, exec, hyprshot -m window -o ~/Pictures/Screenshots/
bind = $mainMod, S, togglespecialworkspace, magic
bind = SUPER, Space, exec, dms ipc call spotlight toggle
bind = SUPER, P, exec, dms ipc call notepad toggle
bind = SUPERALT, L, exec, dms ipc call lock lock
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, T, togglespecialworkspace, tools
bind = SUPER, X, exec, dms ipc call powermenu toggle
bind = SUPER, C, exec, dms ipc call control-center toggle 
bind = $mainMod SHIFT, T, movetoworkspace, special:tools
bind = ALT, space, exec, rofi -show drun -show-icons
bind = $mainMod, RETURN, exec, kitty 
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, C, togglesplit
bind = $mainMod, F, fullscreen

# Window movement
bind = Super+Shift, Left, movewindow, l 
bind = Super+Shift, Right, movewindow, r 
bind = Super+Shift, Up, movewindow, u 
bind = Super+Shift, Down, movewindow, d

# Resize
binde = Super, Minus, splitratio, -0.1
binde = Super, Equal, splitratio, +0.1
binde = Super, Semicolon, splitratio, -0.1 
binde = Super, Apostrophe, splitratio, +0.1

# Focus
bind = $mainMod, l, movefocus, l
bind = $mainMod, h, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = ALT, R, submap, resize
submap = resize
binde = , l, resizeactive, 10 0
binde = , h, resizeactive, -10 0
binde = , k, resizeactive, 0 -10
binde = , j, resizeactive, 0 10
bind = , escape, submap, reset
submap = reset

# Workspace switching
bind = $SUPER_SHIFT, l, exec, hyprlock
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Workspace to monitor assignments
workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

# Dragging binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media keys
bind = , XF86MonBrightnessUp, exec, brightnessctl set +3%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 3%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bind = SHIFT, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bind = SHIFT, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# source = ./dms/cursor.conf

source = ~/.config/hypr/noctalia/noctalia-colors.conf

